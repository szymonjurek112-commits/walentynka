<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Walentynka 💕</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: Arial, sans-serif;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #e63946;
            margin-bottom: 30px;
        }
        button {
            font-size: 18px;
            padding: 12px 25px;
            margin: 10px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }
        .yes {
            background-color: #ff4d6d;
            color: white;
        }
        .no {
            background-color: #ccc;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>💖 Czy zostaniesz moją walentynką? 💖</h1>
    <button class="yes" onclick="yesClick()">TAK</button>
    <button class="no" onclick="noClick()">NIE</button>
</div>

<script>
    function yesClick() {
        document.body.innerHTML = `
        <div style="height:100vh;display:flex;justify-content:center;align-items:center;
        background:linear-gradient(135deg,#ff9a9e,#fad0c4);font-family:Arial;text-align:center;">
            <h1 style="color:#e63946;">🥰 Wiedziałem! <br> Kocham Cię! 💕</h1>
        </div>`;
    }
    function noClick() {
        alert("Nie ma takiej opcji 😄💔");
    }
</script>

</body>
</html>
